<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Say Anything</title>
<style>
  :root{
    --ink:#f4ede4;
    --paper:#171512;
    --paper-raised:#211e1a;
    --line:#3a352c;
    --accent:#e8a33d;
    --muted:#9a8f7d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
  }
  main{width:100%;max-width:560px;}
  h1{
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  p.sub{
    color:var(--muted);
    margin:0 0 28px;
    font-size:15px;
    line-height:1.5;
  }
  form{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:32px;
  }
  textarea{
    width:100%;
    background:transparent;
    border:none;
    color:var(--ink);
    font-size:16px;
    font-family:inherit;
    resize:vertical;
    min-height:80px;
    outline:none;
  }
  textarea::placeholder{color:var(--muted);}
  .form-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .count{font-size:13px;color:var(--muted);}
  button, a.wa-btn{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .send-btn{
    background:var(--accent);
    color:#1a1408;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    border-radius:999px;
    transition:opacity .15s;
  }
  .send-btn:disabled{opacity:.5;cursor:default;}
  /* honeypot - hidden from real people */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

  ul{list-style:none;margin:0;padding:0;}
  li{
    border-bottom:1px solid var(--line);
    padding:16px 4px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
  }
  li .msg{font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  li .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  li .time{font-size:12px;color:var(--muted);}
  a.wa-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  a.wa-btn:hover{border-color:var(--accent);color:var(--accent);}
  .empty, .error{
    color:var(--muted);
    font-size:14px;
    padding:24px 4px;
    text-align:center;
  }
  .error{color:#e8763d;}
  .hint{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
  }

  /* enlarge overlay for screenshots */
  .overlay{
    position:fixed;
    inset:0;
    background:#0e0c09;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .enlarge-card{
    width:100%;
    max-width:480px;
    background:linear-gradient(160deg, var(--paper-raised), #191510);
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px 28px;
    text-align:center;
  }
  .enlarge-msg{
    font-size:26px;
    line-height:1.4;
    font-weight:600;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .enlarge-brand{
    margin-top:24px;
    font-size:13px;
    color:var(--accent);
    letter-spacing:.02em;
  }
  .overlay-hint{
    position:fixed;
    bottom:24px;
    left:0;
    right:0;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    z-index:51;
  }
</style>
</head>
<body>
<main>
  <h1>Say Anything</h1>
  <p class="sub">Drop a message below — no name attached, everyone can see it. Tap a message to enlarge it for a screenshot, or use the WhatsApp button to forward it into the group.</p>

  <form id="form">
    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off">
    <textarea id="content" maxlength="500" placeholder="Say something..." required></textarea>
    <div class="form-footer">
      <span class="count" id="count">500 left</span>
      <button type="submit" class="send-btn" id="submitBtn">Post</button>
    </div>
  </form>

  <ul id="list"><li class="empty">Loading messages…</li></ul>
</main>

<div class="overlay hidden" id="overlay">
  <div class="enlarge-card">
    <div class="enlarge-msg" id="enlargeText"></div>
    <div class="enlarge-brand">Say Anything · anonymous</div>
  </div>
</div>
<div class="overlay-hint hidden" id="overlayHint">Tap anywhere to close</div>

<script>
  // ---- Fill these in from Supabase Settings > API ----
  const SUPABASE_URL = "https://bazlssvusdzptmdtzmqy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhemxzc3Z1c2R6cHRtZHR6bXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzc3NTUsImV4cCI6MjEwNTk1Mzc1NX0.dq6psIvc_MRThRw_pL18AXqqh7r7UswRLM_JqKcZq2I";
  // -----------------------------------------------------

  const REST = `${SUPABASE_URL}/rest/v1/messages`;
  const headers = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json"
  };

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const textarea = document.getElementById("content");
  const count = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const overlay = document.getElementById("overlay");
  const overlayHint = document.getElementById("overlayHint");
  const enlargeText = document.getElementById("enlargeText");

  // keep the raw message text out of the HTML/attributes entirely —
  // store it here, keyed by row id, so odd characters (quotes, emoji,
  // line breaks) can never break the markup.
  let messagesById = {};

  textarea.addEventListener("input", () => {
    count.textContent = `${500 - textarea.value.length} left`;
  });

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(iso){
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return new Date(iso).toLocaleDateString();
  }

  function openEnlarged(id){
    enlargeText.textContent = messagesById[id] || "";
    overlay.classList.remove("hidden");
    overlayHint.classList.remove("hidden");
  }

  overlay.addEventListener("click", () => {
    overlay.classList.add("hidden");
    overlayHint.classList.add("hidden");
  });

  async function loadMessages(){
    try {
      const res = await fetch(`${REST}?select=id,content,created_at&order=created_at.desc&limit=200`, { headers });
      if (!res.ok) throw new Error("fetch failed");
      const rows = await res.json();
      if (!rows.length){
        list.innerHTML = `<li class="empty">No messages yet — be the first.</li>`;
        return;
      }
      messagesById = {};
      rows.forEach(row => messagesById[row.id] = row.content);

      list.innerHTML = rows.map(row => {
        const waHref = "https://wa.me/?text=" + encodeURIComponent(row.content);
        return `
        <li data-id="${row.id}">
          <div class="msg">${escapeHtml(row.content)}</div>
          <div class="row">
            <span class="time">${timeAgo(row.created_at)}</span>
            <a class="wa-btn" href="${waHref}" target="_blank" rel="noopener">Send to WhatsApp</a>
          </div>
        </li>
      `;
      }).join("");
    } catch (err) {
      list.innerHTML = `<li class="error">Couldn't load messages. Check your Supabase URL/key in the code.</li>`;
    }
  }

  // event delegation: tap a message card to enlarge it; the WhatsApp
  // link handles its own click and shouldn't also trigger the overlay.
  list.addEventListener("click", (e) => {
    if (e.target.closest("a.wa-btn")) return;
    const li = e.target.closest("li[data-id]");
    if (li) openEnlarged(li.dataset.id);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const website = form.website.value; // honeypot
    const content = textarea.value.trim();
    if (!content || website) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";
    try {
      const res = await fetch(REST, {
        method: "POST",
        headers: { ...headers, "Prefer": "return=minimal" },
        body: JSON.stringify({ content })
      });
      if (!res.ok) throw new Error("insert failed");
      textarea.value = "";
      count.textContent = "500 left";
      await loadMessages();
    } catch (err) {
      alert("Couldn't post your message. Try again in a moment.");
    } finally {
      submitBtn.textContent = "Post";
      submitBtn.disabled = true;
      setTimeout(() => submitBtn.disabled = false, 3000);
    }
  });

  loadMessages();
  setInterval(loadMessages, 5000); // poll for new messages every 5s
</script>
</body>
</html>
